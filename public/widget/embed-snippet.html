<!--
  BookKing Widget — Copy & Paste Integration

  1. Kopieren Sie diesen Code in Ihre Website
  2. Ersetzen Sie "YOUR-SLUG" mit Ihrem Buchungs-Slug
  3. Optional: Passen Sie Farbe und Sprache an
-->

<!-- Option 1: Web Component (empfohlen) -->
<script src="https://your-domain.com/widget/book-me-widget.js" defer></script>
<book-me-widget
  provider="YOUR-SLUG"
  color="#2563eb"
  lang="de"
  height="700"
></book-me-widget>
